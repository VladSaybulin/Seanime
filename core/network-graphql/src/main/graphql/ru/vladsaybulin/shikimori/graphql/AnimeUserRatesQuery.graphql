query AnimeUserRatesQuery(
    $page: PositiveInt!
    $limit: PositiveInt!
    $status: UserRateStatusEnum!
    $orderInput: UserRateOrderInputType!
    $userId: ID,
) {
    userRates(
        page: $page
        limit: $limit
        status: $status
        targetType: Anime
        userId: $userId
        order: $orderInput
    ) {
        id
        createdAt
        updatedAt
        status
        score
        episodes
        rewatches
        text
        anime {
            id
            name
            russian
            poster {
                originalUrl
                main2xUrl
            }
            kind
            score
            status
            episodes
            episodesAired
            airedOn {
                day
                month
                year
            }
            releasedOn {
                day
                month
                year
            }
        }
    }
}