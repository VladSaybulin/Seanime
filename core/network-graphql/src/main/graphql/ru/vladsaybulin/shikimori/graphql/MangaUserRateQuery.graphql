query MangaUserRateQuery(
    $ids: String!,
    $limit: PositiveInt!
) {
    mangas(
        page: 1
        limit: $limit
        ids: $ids
    ) {
        id
        userRate {
            id
            createdAt
            updatedAt
            status
            chapters
            volumes
            rewatches
            score
            text
        }
    }
}
