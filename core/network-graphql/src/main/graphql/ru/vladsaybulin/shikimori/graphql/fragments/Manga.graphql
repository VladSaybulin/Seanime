fragment BaseMangaFragment on Manga {
    id
    name
    russian
    poster { ...PosterFragment }
    kind
    score
    status
    chapters
    volumes
}

fragment MangaFragment on Manga {
    ...BaseMangaFragment
    airedOn { ...IncompleteDateFragment }
    releasedOn { ...IncompleteDateFragment }
}

fragment MangaWithLocalDateFragment on Manga {
    ...BaseMangaFragment
    airedOn { date }
    releasedOn { date }
}

fragment MangaDetailsFragment on Manga {
    id

    # Shared
    english
    japanese
    licenseNameRu
    synonyms

    genres { ...GenreFragment }

    descriptionHtml
    descriptionSource

    scoresStats { ...ScoreStatFragment }
    statusesStats { ...StatusStatFragment }

    related { ...RelatedEntryFragment }


    # Manga specified
    publishers { ...PublisherFragment }
}

fragment MangaRolesFragment on Manga {
    characterRoles { ...CharacterWithRoleFragment }
    personRoles { ...PersonWithRolesFragment }
}

fragment PublisherFragment on Publisher {
    id
    name
}