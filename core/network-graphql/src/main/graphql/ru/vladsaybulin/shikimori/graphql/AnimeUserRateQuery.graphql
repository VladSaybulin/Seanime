query AnimeUserRateQuery(
    $ids: String!,
    $limit: Int!
) {
    animes(
        page: 1
        limit: $limit
        ids: $ids
    ) {
        id
        userRate {
            id
            createdAt
            updatedAt
            status
            episodes
            rewatches
            score
            text
        }
    }
}
